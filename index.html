<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KhataFlow — Business Billing, Inventory &amp; Digital Ledger</title>
  <meta name="description" content="Complete business management platform combining Vyapar-style GST billing &amp; inventory with Khatabook-style digital ledger." />
  <meta name="theme-color" content="#146C43" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/print.css" />
</head>
<body>
  <!-- Auth / Onboarding Root -->
  <div id="auth-root" class="hidden"></div>

  <!-- Authenticated App Shell -->
  <div id="app-shell" class="app-shell hidden">
    <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>

    <aside id="sidebar" class="sidebar" aria-label="Primary Navigation">
      <div class="sidebar-header">
        <a href="#/dashboard" class="brand-mark">
          <img src="/assets/logo/logo.svg" alt="KhataFlow" />
          <span>KhataFlow</span>
        </a>
        <button id="close-sidebar-btn" class="btn-icon mobile-menu-btn" aria-label="Close menu">&times;</button>
      </div>

      <div class="business-switcher-wrap">
        <select id="business-switcher" class="business-switcher" aria-label="Switch Business"></select>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <div class="user-mini">
          <div id="sidebar-user-avatar" class="user-avatar">U</div>
          <div class="user-meta">
            <div id="sidebar-user-name" class="user-name">User</div>
            <div id="sidebar-user-role" class="user-role">Owner</div>
          </div>
        </div>
        <button id="logout-btn" class="btn-icon" title="Sign out" aria-label="Sign out">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button id="open-sidebar-btn" class="mobile-menu-btn" aria-label="Open menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="page-title-bar">
            <h1 id="topbar-title">Dashboard</h1>
          </div>
        </div>

        <div class="topbar-right">
          <div class="global-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="global-search-input" placeholder="Search parties, products, bills..." />
          </div>

          <button id="install-pwa-btn" class="btn btn-soft btn-sm hidden">Install App</button>

          <span id="network-status-pill" class="status-pill" title="Database sync status">
            <span class="status-dot"></span>
            <span id="network-status-text">Online</span>
          </span>

          <a href="#/notifications" class="btn-icon" title="Notifications" aria-label="Notifications" style="position:relative;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span id="topbar-notif-dot" class="hidden" style="position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:999px;background:var(--danger);"></span>
          </a>
        </div>
      </header>

      <main id="page-content" class="page-content">
        <div class="state-box">
          <div class="spinner"></div>
          <p class="text-muted">Loading workspace...</p>
        </div>
      </main>
    </div>

    <nav id="mobile-bottom-nav" class="mobile-bottom-nav" aria-label="Quick Mobile Navigation">
      <a href="#/dashboard" class="mobile-nav-item" data-route="/dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Home</span>
      </a>
      <a href="#/ledger" class="mobile-nav-item" data-route="/ledger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Khata</span>
      </a>
      <a href="#/parties" class="mobile-nav-item" data-route="/parties">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        <span>Customers</span>
      </a>
      <a href="#/stores" class="mobile-nav-item" data-route="/stores">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Stores</span>
      </a>
      <a href="#/reports" class="mobile-nav-item" data-route="/reports">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Reports</span>
      </a>
    </nav>
  </div>

  <!-- Modal & Toast Containers -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-container" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
